# Production defaults. Keep machine-specific overrides outside the repository.
[net]
bindto = "0.0.0.0"
port = 1212
tickrate = 30
max_connections = 32
[status]
enabled = true
connectaddress = ""
[game]
desc = "TarkovStation: мирный хаб, торговля, рейды и общий десятичасовой цикл. Рейдовый режим."
hostname = "TarkovStation | Перевал / 17"
defaultpreset = "TarkovStation"
map = "TarkovStationHub"
map_rotation = false
fallbackenabled = false
lobbyenabled = true
lobbyduration = 5
role_timers = false
role_loadout_timers = false
round_restart_time = 5.0
[hub]
advertise = false
[auth]
mode = 1
allowlocal = false
[console]
loginlocal = false
[vote]
restart_enabled = false
preset_enabled = false
map_enabled = false
[build]
fork_id = "tarkovstation"
[loc]
culture_name = "ru-RU"
[tarkov]
enabled = true
cycle_seconds = 36000
queue_seconds = 30
raid_seconds = 900
extraction_seconds = 8
starting_money = 2500
database = "tarkovstation.db"

# Disable station infrastructure/maps that do not belong to the hub-and-raids mode.
[lavaland]
enabled = false
[shuttle]
arrivals = false
emergency = false
auto_call_time = 0
auto_call_extension_time = 0
grid_fill = false
preload_grids = false
[procgen]
preload = false
[worldgen]
enabled = false
[gateway]
generator_enabled = false
[holidays]
enabled = false
[ooc]
enabled = true
enable_during_round = true

[server]
id = "TarkovStation"
lobby_name = "TarkovStation"
rules_file = "TarkovStationRules"

[infolinks]
discord = "https://discord.gg/jgUJ9Kwa7K"
wiki = ""
forum = ""
github = "https://github.com/ultradyper/TarkovStation"
website = ""
