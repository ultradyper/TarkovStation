# region Closets

- type: entityTable
  id: RandomMaintenanceEmergencyLockers
  table: !type:GroupSelector
    children:
    - !type:AllSelector
      weight: 1.2
      children:
      - id: ClosetEmergencyFilledRandom
      - id: ClosetFireFilled
    - !type:AllSelector
      children:
      - id: ClosetEmergencyFilledRandom
      - id: ClosetEmergencyN2FilledRandom
    - !type:AllSelector
      children:
      - id: ClosetEmergencyN2FilledRandom
      - id: ClosetFireFilled

- type: entityTable
  id: RandomMaintenanceLockers
  table: !type:GroupSelector
    children:
    - id: ClosetMaintenanceFilledRandom
    - id: ClosetMaintenanceFilledRandom
      amount: 2
      weight: 0.35

# endregion Closets

# region Canisters

- type: entityTable
  id: RandomCommonCanisters
