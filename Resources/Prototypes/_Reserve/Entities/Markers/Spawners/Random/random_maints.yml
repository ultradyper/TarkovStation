- type: entity
  parent: MarkerBase
  id: RandomMaintenanceObjectSpawner
  name: random maintenance object spawner
  description: Spawns a random maints object (locker(s), crate, etc.)
  suffix: Maintenance Tunnels
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Structures/Storage/closet.rsi
      state: generic
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: RandomMaintenanceObjects

- type: entity
  parent: RandomMaintenanceObjectSpawner
  id: RandomMaintenanceObjectSpawner75
  suffix: Maintenance Tunnels, 75%
  components:
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: RandomMaintenanceObjects
      prob: 0.75

- type: entity
  parent: MarkerBase
  id: RandomMaintenanceWallObjectSpawner
  name: random maintenance wall object spawner
  description: Spawns a random maints wall object (shelf, poster, etc.)
