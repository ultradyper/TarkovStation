# Title: Orchito

# A tea-based refreshing cocktail made by Orchi Dea - a non-alcoholic version of a regular mojito.
#
# Includes:
#
# - Orchito (the regular version, can be made by shaking all needed ingredients together)
# - Stardust Orchito (can be made by mixing orchito with stardust)
#
# Disclaimer:
#
# - This is a personal item, so all dependent prototypes are not meant to be mapped (with exceptions).





# region PROTOTYPES





# region Orchito

- type: reagent
  parent: BaseDrink
  id: Orchito
  name: reagent-name-orchito
  desc: reagent-desc-orchito
  physicalDesc: reagent-physical-desc-sweet
  flavor: icedtea
  color: &orchito-color "#a0f080"
  metamorphicSprite:
    sprite: &orchito-rsi _Reserve/Objects/Misc/stardust.rsi
    state: glass_orchito_empty
  metamorphicMaxFillLevels: 6
  metamorphicFillBaseName: glass_orchito_fill-
  metamorphicChangeColor: false
  metabolisms:
    Drink:
      effects:
      - !type:SatiateThirst
        factor: 5
      - !type:AdjustReagent
        reagent: Theobromine
        amount: 0.01
      - !type:ChemAddMoodlet
        moodPrototype: SweetenerEffect

- type: reaction
  id: Orchito
  requiredMixerCategories:
  - Shake
  reactants:
    IcedTea:
      amount: 3
    JuiceLemon:
      amount: 1
    JuiceLime:
      amount: 1
    Sugar:
      amount: 1
  products:
    Orchito: 6

- type: ntrTask
  id: TaskOrchito
  proto: TaskBottle
  reward: 2
  weight: 0.2
  cooldown: 300
  description: task-ntr-orchito-desc
  reagentTask: true
  reagents:
    Orchito: 3000
  entries:
  - name: task-ntr-drink-base-name
    stamps: [ ]
    whitelist:
      tags: [ ]
      components: [ ]

# endregion Orchito

# region Orchito Candy

- type: microwaveMealRecipe
  id: RecipeFoodSnackOrchito
  result: FoodSnackOrchito
  time: 5
  group: Dessert
  reagents:
    Orchito: 5

- type: entity
  parent: FoodSnackStardust
  id: FoodSnackOrchito
  components:
  - type: Sprite
    sprite: *orchito-rsi
    state: item_candy_orchito
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 5
        reagents:
        - ReagentId: Orchito
          Quantity: 5

- type: entity
  parent: FoodSnackLollypopStardust
  id: FoodSnackLollypopOrchito
  components:
  - type: Sprite
    layers:
    - state: lollypop
      map: [ "enum.AmmoVisualLayers.Base" ]
    - state: color
      map: [ "enum.AmmoVisualLayers.Tip" ]
      color: *orchito-color
  - type: SolutionContainerManager
    solutions:
      food:
        maxVol: 20
        reagents:
        - ReagentId: Sugar
          Quantity: 5
        - ReagentId: Orchito
          Quantity: 15

# endregion Orchito Candy

