# region Stardust Orchito

- type: reagent
  parent: BaseDrink
  id: StardustOrchito
  name: reagent-name-stardust-orchito
  desc: reagent-desc-stardust-orchito
  physicalDesc: reagent-physical-desc-enigmatic
  flavor: stardust
  color: &stardust-orchito-color "#02667f"
  metamorphicSprite:
    sprite: *orchito-rsi
    state: glass_orchito_stardust_empty
  metamorphicMaxFillLevels: 6
  metamorphicFillBaseName: glass_orchito_stardust_fill-
  metamorphicChangeColor: false
  metabolisms:
    Drink:
      effects:
      - !type:AdjustReagent
        reagent: Stardust
        amount: 1.15
      - !type:SatiateThirst
        factor: 4
      - !type:AdjustReagent
        reagent: Theobromine
        amount: 0.01
      - !type:ChemAddMoodlet
        moodPrototype: SweetenerEffect

- type: reaction
  id: StardustOrchito
  reactants:
    Orchito:
      amount: 2
    Stardust:
      amount: 1
  products:
    StardustOrchito: 3

# endregion Stardust Orchito

# region Stardust Orchito Candy

- type: microwaveMealRecipe
