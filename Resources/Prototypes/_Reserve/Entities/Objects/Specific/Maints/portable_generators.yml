- type: entity
  parent: PortableGeneratorSuperPacman
  id: PortableGeneratorUberPacman
  name: U.B.E.R.P.A.C.M.A.N.-type portable generator
  description: |-
    An edge-cutting generator for powering departments.
    Extra-efficiently runs off uranium sheets and is rated for up to 75 kW.
  suffix: Uranium, 75 kW, Maintenance Tunnels
  components:
    - type: Sprite
      layers:
        - state: portgen2
          map: [ "enum.GeneratorVisualLayers.Body" ]
        - state: portgen_on_unlit
          map: [ "enum.GeneratorVisualLayers.Unlit" ]
          shader: unshaded
          visible: false
    - type: GenericVisualizer
      visuals:
        enum.GeneratorVisuals.Running:
          enum.GeneratorVisualLayers.Body:
            True: { state: portgen2on }
            False: { state: portgen2 }
          enum.GeneratorVisualLayers.Unlit:
            True: { visible: true }
            False: { visible: false }
    - type: FuelGenerator
      minTargetPower: 10000
      maxTargetPower: 75000
      targetPower: 75000
      optimalPower: 75000
      # 60 minutes at full power
      optimalBurnRate: 0.0088888
      # Barely save any fuel from reducing power output
      fuelEfficiencyConstant: 0.25
    - type: PowerMonitoringDevice
      sprite: Structures/Power/Generation/portable_generator.rsi
      state: portgen2

- type: entity
  parent: PortableGeneratorSuperPacman
  id: PortableGeneratorBluespacePacman
  name: B.S.P.A.C.M.A.N.-type portable generator
  description: |-
    An experimental generator for powering departments.
    Runs off bluespace crystals and is rated for up to 50 kW.
  suffix: Bluespace Crystals, 50 kW, Maintenance Tunnels
  components:
    - type: Sprite
      layers:
        - state: portgen2
          map: [ "enum.GeneratorVisualLayers.Body" ]
          color: "#22aaff"
        - state: portgen_on_unlit
          map: [ "enum.GeneratorVisualLayers.Unlit" ]
          shader: unshaded
          visible: false
    - type: GenericVisualizer
      visuals:
        enum.GeneratorVisuals.Running:
          enum.GeneratorVisualLayers.Body:
            True: { state: portgen2on }
            False: { state: portgen2 }
          enum.GeneratorVisualLayers.Unlit:
            True: { visible: true }
            False: { visible: false }
    - type: FuelGenerator
      minTargetPower: 10000
      maxTargetPower: 50000
      targetPower: 50000
      optimalPower: 50000
      # 120 minutes at full power
      optimalBurnRate: 0.0044444
      # Barely save any fuel from reducing power output
      fuelEfficiencyConstant: 0.15
    - type: SolidFuelGeneratorAdapter
      fuelMaterial: BSCrystal
      multiplier: 0.01
    - type: MaterialStorage
      storageLimit: 3000
      materialWhiteList: [BSCrystal]
    - type: PowerMonitoringDevice
      sprite: Structures/Power/Generation/portable_generator.rsi
      state: portgen2

- type: entity
  parent: PortableGeneratorSuperPacman
  id: PortableGeneratorSpecialPacman
  name: S.P.A.C.M.A.N.-type portable generator
  description: |-
    A small generator capable of powering individual rooms, in case of emergencies.
    Runs off wooden planks and is rated for up to 8 kW.
    Rated ages 3 and up.
  suffix: Wooden Planks, 8 kW, Maintenance Tunnels
  components:
    - type: AmbientSound
      range: 4
      volume: -8
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.30,-0.30,0.30,0.30"
          density: 80
          mask:
            - MachineMask
          layer:
            - MachineLayer
    - type: Sprite
      layers:
        - state: portgen3
          map: [ "enum.GeneratorVisualLayers.Body" ]
          color: "#aa7744"
        - state: portgen3on_unlit
          map: [ "enum.GeneratorVisualLayers.Unlit" ]
          shader: unshaded
          visible: false
    - type: GenericVisualizer
      visuals:
        enum.GeneratorVisuals.Running:
          enum.GeneratorVisualLayers.Body:
            True: { state: portgen3on }
            False: { state: portgen3 }
          enum.GeneratorVisualLayers.Unlit:
            True: { visible: true }
            False: { visible: false }
    - type: FuelGenerator
      targetPower: 5000
      minTargetPower: 4000
      optimalPower: 8000
      maxTargetPower: 8000
      # 20 minutes at full stack.
      optimalBurnRate: 0.0255555
      # Shallow curve that allows you to just barely eek out 12 minutes at lowest.
      fuelEfficiencyConstant: 0.3
    - type: SolidFuelGeneratorAdapter
      fuelMaterial: Wood
      multiplier: 0.01
    - type: MaterialStorage
      storageLimit: 3000
      materialWhiteList: [Wood]
    - type: PortableGenerator
      # Unreliable bugger
      startChance: 0.5
    - type: NodeContainer
      examinable: true
      nodes:
        output:
          !type:CableDeviceNode
          nodeGroupID: Apc
    - type: PowerMonitoringDevice
      group: Generator
      loadNode: output
      sprite: Structures/Power/Generation/portable_generator.rsi
      state: portgen3
    - type: PowerSupplier
      # No ramping needed on this bugger.
      voltage: Apc
      supplyRampTolerance: 2000
    - type: GeneratorExhaustGas
      gasType: CarbonDioxide
      # Full tank is 25 moles of gas
      moleRatio: 0.5
    - type: Explosive
      explosionType: Default
      tileBreakScale: 0
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 200
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:SpillBehavior
              solution: tank
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:ChangeConstructionNodeBehavior
              node: machineFrame
            - !type:DoActsBehavior
              acts: ["Destruction"]
        - trigger:
            !type:DamageTypeTrigger
            damageType: Piercing
            damage: 75
          behaviors:
            - !type:SolutionExplosionBehavior
              solution: tank
