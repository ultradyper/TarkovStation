# region Blood

- type: entity
  parent: WeldingFuelTank
  id: BloodTankFull
  name: blood tank
  suffix: Full, Maintenance Tunnels
  components:
  - type: SolutionContainerManager
    solutions:
      tank:
        reagents:
        - ReagentId: Blood
          Quantity: 1500

- type: entity
  parent: WeldingFuelTankHighCapacity
  id: BloodTankHighCapacity
  name: high-capacity blood tank
  description: A highly pressurized blood tank made to hold gargantuan amounts of blood.
  suffix: Full, Maintenance Tunnels
  components:
  - type: SolutionContainerManager
    solutions:
      tank:
        reagents:
        - ReagentId: Blood
          Quantity: 10000
        maxVol: 10000

# endregion Blood

