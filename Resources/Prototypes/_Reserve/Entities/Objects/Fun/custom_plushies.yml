    solutions:
      food:
        maxVol: 30
        reagents:
        - ReagentId: Fiber
          Quantity: 10
        - ReagentId: ChangelingSting
          Quantity: 3

- type: entity
  parent: PlushieDotusaruTaipan
  id: PlushieDotusaruTaipanRainbow
  components:
  - type: PointLight
    radius: 1.5
    energy: 2
  - type: RgbLightController
    layers: [ 0 ]
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        shader: unshaded
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        shader: unshaded
      right:
      - state: inhand-right
        shader: unshaded
  - type: PhysicalComposition
    materialComposition:
      Cloth: 100
      Plasma: 100
  - type: StaticPrice
    price: 50

- type: entity
  parent: PlushieDotusaruTaipan
  id: PlushieDotusaruTaipanSyndicate
  components:
  - type: Sprite
    color: "#810e0e"
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        color: "#810e0e"
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#810e0e"
      right:
      - state: inhand-right
        color: "#810e0e"

- type: entity
  parent: PlushieDotusaruTaipan
  id: PlushieDotusaruTaipanLarge
  components:
  - type: Sprite
    scale: 1.5, 1.5
  - type: Item
    size: Normal
  - type: MultiHandedItem

