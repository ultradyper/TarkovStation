# Title: Reserve Plushies

# This file contains the definitions for custom crew/player plushies for Reserve Station.





# region PROTOTYPES





# region Artizzi

- type: entity
  parent: BasePlushie
  id: PlushieArtizziKasya
  components:
  - type: Sprite
    sprite: &PlushieArtizziSprite _Reserve/Objects/Fun/Plushies/kasya.rsi
    state: icon
  - type: Item
    sprite: *PlushieArtizziSprite
  - type: Clothing
    sprite: *PlushieArtizziSprite
    slots:
    - HEAD
    quickEquip: false
    clothingVisuals:
      head:
      - state: equipped-HELMET
        offset: "0, 0.04"
  - type: EmitSoundOnUse
    sound: &PlushieArtizziSound
      path: /Audio/_Reserve/Items/Toys/bwaaa.ogg
  - type: EmitSoundOnLand
    sound: *PlushieArtizziSound
  - type: EmitSoundOnActivate
    sound: *PlushieArtizziSound
  - type: EmitSoundOnTrigger
    sound: *PlushieArtizziSound
  - type: EmitSoundOnCollide
    sound: *PlushieArtizziSound
  - type: Edible
    useSound: *PlushieArtizziSound
  - type: MeleeWeapon
    soundHit: *PlushieArtizziSound

- type: entity
  parent: PlushieArtizziKasya
  id: PlushieArtizziKasyaLarge
  components:
  - type: Sprite
    scale: 1.5, 1.5
  - type: Item
    size: Normal
  - type: MultiHandedItem

# endregion Artizzi

