- type: entity
  parent: MarkerBase
  id: RandomSpawner
  name: Trash Spawner
  suffix: 50
  components:
    - type: Sprite
      layers:
        - state: red
        - sprite: Objects/Consumable/Food/snacks.rsi
          state: pistachio-trash
    - type: EntityTableSpawner
      offset: 0.2
      table: !type:NestedSelector
        tableId: GenericTrashItems
        prob: 0.5
  placement:
    mode: AlignTileAny

- type: entity
  parent: RandomSpawner
  id: RandomSpawner100
  suffix: 100
  placement:
    mode: AlignTileAny
  components:
  - type: EntityTableSpawner
    offset: 0.2
    table: !type:NestedSelector
      tableId: GenericTrashItems

- type: entity
  parent: MarkerBase
  id: RandomBananaPeel90
  name: random banana peel spawner
  components:
  - type: Sprite
    layers:
    - state: red
    - sprite: Objects/Specific/Hydroponics/banana.rsi
      state: peel
  - type: EntityTableSpawner
    table: !type:NestedSelector
      tableId: AllBananaPeelsTable
      prob: 0.9
