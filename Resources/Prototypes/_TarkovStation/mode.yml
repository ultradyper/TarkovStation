  - tarkov
  name: tarkov-preset-name
  description: tarkov-preset-description
  showInVote: false
  minPlayers: 0
  rules:
  - TarkovStationRule
- type: entity
  id: TarkovStationRule
  parent: BaseGameRule
  components:
  - type: TarkovRule
- type: entity
  id: TarkovStationHubStation
  parent:
  - BaseStation
  - BaseStationJobsSpawning
  components:
