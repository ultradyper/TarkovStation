- type: htnCompound
  id: TarkovStationInhabitantCompound
  branches:
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:TarkovMaintainWeaponOperator
  - preconditions:
    - !type:ActiveHandComponentPrecondition
      components:
      - type: Gun
    tasks:
    - !type:HTNCompoundTask
      task: TarkovStationRangedCombatCompound
  - tasks:
    - !type:HTNCompoundTask
      task: TarkovStationMeleeCombatCompound
  - tasks:
    - !type:HTNPrimitiveTask
      operator: !type:TarkovFindLootOperator
    - !type:HTNPrimitiveTask
      operator: !type:MoveToOperator
        targetKey: TarkovLootCoordinates
        rangeKey: TarkovLootRange
        pathfindInPlanning: true
    - !type:HTNPrimitiveTask
      operator: !type:TarkovCollectLootOperator
  - tasks:
    - !type:HTNCompoundTask
      task: IdleCompound

# Adapted from the native gun combat tasks. Tarkov inhabitants finish living critical targets.
- type: htnCompound
  id: TarkovStationGunCombatCompound
  branches:
    # Pick target, then move into range and shoot them.
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: TarkovStationGunTargets

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            stopOnLineOfSight: true
            rangeKey: MeleeRange

        - !type:HTNPrimitiveTask
          operator: !type:JukeOperator
            jukeType: AdjacentTile

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:GunOperator
            targetState: HardCritical
            targetKey: Target
          services:
            - !type:UtilityService
              id: TarkovStationRangedService
              proto: TarkovStationGunTargets
              key: Target

- type: htnCompound
  id: TarkovStationRangedCombatCompound
  branches:
    # Goobstation - drop a gun if it can't be wielded and wielding is required
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
          - type: Gun
          - type: GunRequiresWield
        - !type:UnwieldedEntityInHandsPrecondition
        - !type:CanWieldPrecondition
          invert: true
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
          - !type:ActiveHandEntityPrecondition
          operator: !type:DropOperator

    # Goobstation - wield an item if it's wieldable
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
          - type: Gun
          - type: Wieldable
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
          - !type:UnwieldedEntityInHandsPrecondition
          operator: !type:WieldOperator

    # Goobstation start - Cycle/Rack/Empty a gun if it can't shoot
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
            - type: BallisticAmmoProvider
        - !type:GunCanFirePrecondition
          invert: true
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandEntityPrecondition
          operator: !type:InteractWithOperator
            targetKey: ActiveHandEntity

    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
            - type: MagazineAmmoProvider
        - !type:GunCanFirePrecondition
          invert: true
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandEntityPrecondition
          operator: !type:InteractWithOperator
            targetKey: ActiveHandEntity

    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
            - type: ChamberMagazineAmmoProvider
        - !type:GunCanFirePrecondition
          invert: true
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandEntityPrecondition
          operator: !type:InteractWithOperator
            targetKey: ActiveHandEntity

    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
            - type: RevolverAmmoProvider
        - !type:GunCanFirePrecondition
          invert: true
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandEntityPrecondition
          operator: !type:AltInteractOperator
            targetKey: ActiveHandEntity
    # Goobstation end

    # Move to target and shoot them if ammo
    - preconditions:
        - !type:GunAmmoPrecondition
          minPercent: 0.001
      tasks:
        - !type:HTNCompoundTask
          task: TarkovStationGunCombatCompound

    # Reload gun
    # TODO

    # Equip a gun from inventory if one found, preferring over pickup.
    # TODO: Doing inventory cleanly will be a PITA so deferring to later
    # The issue is recursively checking items but also ignoring some recursive entities
    # i.e. we need to recursively go into storage containers.
    #- tasks:
    #   - !type:HTNCompoundTask
    #     task: ClearActiveHandCompound
    #
    #   - !type:HTNPrimitiveTask
    #     operator: !type:UtilityOperator
    #       proto: InventoryGuns
    #
    #   - !type:HTNPrimitiveTask
    #     operator: !type:EquipOperator

    # Pickup ammo if any nearby
    #- preconditions:
    #    - !type:GunAmmoPrecondition
    #      maxPercent: 0.0
    #  tasks:
    #    - !type:HTNCompoundTask
    #      task: ClearActiveHandCompound
#
#        - !type:HTNCompoundTask
#          task: PickupAmmoCompound

    # Pickup gun with ammo if we have no ammo
    -  preconditions:
         - !type:ActiveHandComponentPrecondition
           components:
             - type: Gun
           invert: true
       tasks:
         - !type:HTNCompoundTask
           task: PickupGunCompound

    # Discard gun if no ammo
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
            - type: Gun
        - !type:GunAmmoPrecondition
          maxPercent: 0.001
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:ActiveHandEntityPrecondition
          operator: !type:DropOperator

# TODO: Reload a nearby gun

- type: utilityQuery
  id: TarkovStationGunTargets
  query:
    - !type:NearbyHostilesQuery
  considerations:
    # Goobstation - check is dead instead so we can target non-living stuff
    - !type:TargetIsDeadCon
      curve: !type:InverseBoolCurve
    - !type:TurretTargetingCon
      curve: !type:BoolCurve
    - !type:TargetDistanceCon
      curve: !type:PresetCurve
        preset: TargetDistance
    - !type:TargetHealthCon
      curve: !type:PresetCurve
        preset: TargetHealth
    - !type:TargetAccessibleCon
      curve: !type:BoolCurve
    - !type:TargetInLOSOrCurrentCon
      curve: !type:BoolCurve


- type: htnCompound
  id: TarkovStationMeleeCombatCompound
  branches:
    - tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UtilityOperator
            proto: NearbyMeleeTargets
        - !type:HTNCompoundTask
          task: TarkovStationBeforeMeleeAttackTargetCompound

- type: htnCompound
  id: TarkovStationBeforeMeleeAttackTargetCompound
  branches:
    - preconditions:
        - !type:BuckledPrecondition
          isBuckled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UnbuckleOperator
            shutdownState: TaskFinished

    - preconditions:
        - !type:PulledPrecondition
          isPulled: true
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:UnPullOperator
            shutdownState: TaskFinished

    - preconditions:
        - !type:InContainerPrecondition
          isInContainer: true
      tasks:
        - !type:HTNCompoundTask
          task: EscapeCompound

    # Pickup weapon if we don't have one.
    - preconditions:
        - !type:ActiveHandComponentPrecondition
            components:
              # Just serializer things
              - type: MeleeWeapon
                damage:
                  types:
                    Blunt: 0
            invert: true
      tasks:
        - !type:HTNCompoundTask
          task: PickupMeleeCompound

    # Goobstation - wield an item if it's wieldable
    - preconditions:
        - !type:ActiveHandComponentPrecondition
          components:
          - type: Wieldable
      tasks:
        - !type:HTNPrimitiveTask
          preconditions:
          - !type:UnwieldedEntityInHandsPrecondition
          operator: !type:WieldOperator

    # Melee combat (unarmed or otherwise)
    - tasks:
        - !type:HTNCompoundTask
          task: TarkovStationMeleeAttackTargetCompound

- type: htnCompound
  id: TarkovStationMeleeAttackTargetCompound
  branches:
    - preconditions:
      - !type:KeyExistsPrecondition
        key: Target
      tasks:
        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            shutdownState: PlanFinished
            pathfindInPlanning: true
            removeKeyOnFinish: false
            brakeMaxVelocity: null # Goobstation - no braking
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange
        - !type:HTNPrimitiveTask
          operator: !type:JukeOperator
            jukeType: Away
        - !type:HTNPrimitiveTask
          operator: !type:MeleeOperator
            targetState: HardCritical
            targetKey: Target
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
            - !type:TargetInRangePrecondition
              targetKey: Target
              rangeKey: MeleeRange
          services:
            - !type:UtilityService
              id: MeleeService
              proto: NearbyMeleeTargets
              key: Target
